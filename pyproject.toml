[project]
name = "au-radar"
version = "0.1.0"
description = "AU sovereign-legibility benchmark, RADAR-consistent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "playwright>=1.47.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
